name: Build CV PDF + HTML

on:
  push:
    paths:
      - "entries/**"
      - "build_cv.py"
      - "build_html.py"
      - "**.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Build cv.tex
        run: python3 build_cv.py

      - name: Compile PDF
        run: pdflatex cv.tex

      - name: Build HTML
        run: python3 build_html.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cv.pdf cv.html
          git commit -m "Auto-build CV PDF + HTML" || echo "No changes"
          git push
