name: Build CV PDF

on:
  push:
    paths:
      - "entries/**"
      - "build_cv.py"
      - "**.tex"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended

      - name: Build cv.tex
        run: python3 build_cv.py

      - name: Compile PDF
        run: pdflatex cv.tex

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cv.pdf cv.tex
          git commit -m "Auto-build CV PDF" || echo "No changes"
          git push
